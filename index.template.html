*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#b9cecc}body{display:flex;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#e1ebe5,#a9c5c6 90%)}main{height:100%;height:100dvh;width:100%;max-width:540px;position:relative;box-shadow:0 0 80px #214c542b;background:#f0f6f1}canvas{display:block;width:100%;height:100%;touch-action:none;image-rendering:pixelated;outline:none;-webkit-user-select:none;user-select:none}noscript{position:absolute;top:20%;padding:30px;font:16px monospace;color:#234350} @media(min-aspect-ratio:1/1){main{max-width:min(540px,64vh)}}

<style>
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}main{height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom))}#app-status{position:absolute;z-index:5;inset:0;display:grid;place-items:center;background:#eef5f1;color:#244451;font:14px monospace}#app-status[hidden]{display:none}#install-app{position:absolute;z-index:3;right:12px;bottom:12px;border:1px solid #8faeaa;background:#eef5f1;color:#244451;padding:8px 12px;font:12px monospace;border-radius:5px}#install-app[hidden]{display:none}#install-help{max-width:320px;border:1px solid #8faeaa;border-radius:8px;background:#eef5f1;color:#244451;padding:22px;font:15px/1.5 system-ui}#install-help::backdrop{background:#24445166}#install-help button{padding:8px 16px;color:#244451;background:#d5e5df;border:1px solid #8faeaa;border-radius:4px}#install-help a{color:#24716d}
